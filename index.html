<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Task Tracker</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f6fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 20px 25px 30px 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.task {
    margin-bottom: 20px;
}

.task label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

textarea, select {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 13px;
}

textarea {
    resize: none;
    overflow: hidden;
}

.buttons {
    text-align: center;
    margin-top: 20px;
}

button {
    padding: 8px 20px;
    margin: 6px;
    border: none;
    border-radius: 6px;
    background-color: #2f6fed;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background-color: #1e4fc5;
}

.copy-section {
    margin-top: 12px;
    background: #f1f3f8;
    padding: 10px;
    border-radius: 6px;
}

.copy-section label {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 4px;
    display: block;
}
</style>

<script>
function autoExpand(field) {
    field.style.height = "auto";
    field.style.height = (field.scrollHeight) + "px";
}

function buildOutput() {
    let result = "";

    document.querySelectorAll(".task").forEach(task => {
        let title = task.dataset.title;
        let text = task.querySelector("textarea").value.trim();
        let res = task.querySelector("select").value;

        if (text || res) {
            result += title + ": " + text;
            if (res) result += " // " + res;
            result += "\n";
        }
    });

    document.getElementById("output").value = result.trim();
    autoExpand(document.getElementById("output"));
}

function copyOutput() {
    let output = document.getElementById("output");
    output.select();
    document.execCommand("copy");
}
</script>
</head>

<body>
<div class="container">

<h1>User Task Notes</h1>

<!-- MANAGE CLAIMS -->
<div class="task" data-title="Manage Claims">
<label>Manage Claims</label>
<textarea oninput="autoExpand(this)">checked claims</textarea>
<select>
<option value="">Select result</option>
<option>claim paid</option>
<option>claim rejected</option>
<option>claim reversed</option>
<option>duplicate claim identified</option>
<option>escalated</option>
<option>no avail override</option>
<option>override applied per psa j/a</option>
<option>pharm unable to reverse</option>
<option>r75 / prior authorization required</option>
<option>r76 / quantity limits</option>
<option>r88 / dur</option>
<option>r943 / refill too soon</option>
<option>reviewed pricing details</option>
</select>
</div>

<!-- VIEW BENEFITS -->
<div class="task" data-title="View Benefits">
<label>View Benefits</label>
<textarea oninput="autoExpand(this)">checked benefit coverage</textarea>
<select>
<option value="">Select result</option>
<option>reviewed benefit details</option>
<option>category coverage confirmed</option>
<option>reviewed copay structure</option>
<option>cost share provided per tier</option>
<option>coverage confirmed</option>
<option>plan limitation applies</option>
<option>utilization management applies</option>
</select>
</div>

<!-- COST ESTIMATOR -->
<div class="task" data-title="Cost Estimator">
<label>Cost Estimator</label>
<textarea oninput="autoExpand(this)">checked cost and coverage for medication</textarea>
<select>
<option value="">Select result</option>
<option>advised non formulary</option>
<option>advised of prior authorization / quantity limits required</option>
<option>advised of tier / coverage</option>
<option>cost varies by pharmacy</option>
<option>estimated copay provided</option>
<option>provided alt medications</option>
<option>tier level identified</option>
</select>
</div>

<!-- REQUEST SUMMARY -->
<div class="task" data-title="Request Summary">
<label>Request Summary</label>
<textarea oninput="autoExpand(this)">check prior authorization status for rx</textarea>
<select>
<option value="">Select result</option>
<option>advised of appeal / next steps per denial letter</option>
<option>advised of approval</option>
<option>advised of denial</option>
<option>advised to schedule p2p</option>
<option>clinical review in progress</option>
<option>provider outreach needed / additional info being requested</option>
</select>
</div>

<!-- SENDING FORMS -->
<div class="task" data-title="Sending Forms">
<label>Sending Forms</label>
<textarea oninput="autoExpand(this)">reviewed forms</textarea>
<select>
<option value="">Select result</option>
<option>follow up recommended</option>
<option>forms emailed</option>
<option>forms faxed</option>
<option>prior authorization approval resent to provider</option>
<option>prior authorization denial resent to provider</option>
<option>turnaround time provided per j/a</option>
</select>
</div>

<!-- PRIME RESOLUTION -->
<div class="task" data-title="Prime Resolution">
<label>Prime Resolution</label>
<textarea oninput="autoExpand(this)">reviewed cases</textarea>
<select>
<option value="">Select result</option>
<option>case already open</option>
<option>case closed</option>
<option>case created</option>
<option>case escalated</option>
<option>case updated</option>
<option>no case needed</option>
</select>
</div>

<!-- LOCATE PHARM -->
<div class="task" data-title="Locate Pharmacy">
<label>Locate Pharmacy</label>
<textarea oninput="autoExpand(this)">checked in network pharms</textarea>
<select>
<option value="">Select result</option>
<option>located and provided pharm details</option>
<option>mail order option provided</option>
<option>pharmacy not found</option>
<option>provider to resend rx</option>
</select>
</div>

<!-- ACCUMULATORS -->
<div class="task" data-title="Accumulators">
<label>Accumulators</label>
<textarea oninput="autoExpand(this)">reviewed current accumulator totals</textarea>
<select>
<option value="">Select result</option>
<option>accumulators incorrect</option>
<option>accumulators reset upcoming</option>
<option>accumulators still accruing</option>
<option>advised of accumulator balances</option>
<option>ded met</option>
<option>ded remaining</option>
<option>financial responsibility explained</option>
<option>oop max met</option>
<option>oop max remaining</option>
<option>recent claims not yet applied</option>
</select>
</div>

<!-- OUTPUT -->
<div class="copy-section">
<label>FINAL NOTE OUTPUT</label>
<textarea id="output" readonly oninput="autoExpand(this)"></textarea>
</div>

<div class="buttons">
<button onclick="buildOutput()">Build Note</button>
<button onclick="copyOutput()">Copy</button>
</div>

</div>
</body>
</html>
