<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>task based call note</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}

.container{background:#111;padding:20px;border-radius:10px;max-width:600px;margin:auto}

label{display:block;margin:8px 0 4px}
input,textarea{width:100%;background:#222;color:#fff;border:none;padding:10px;border-radius:6px}

.row{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;margin:3px 0}

.resGroup,.subnote{display:none;margin-left:30px;width:calc(100% - 30px)}

.outputBox{
  margin-top:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
}

.button-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
button{background:#444;color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer}

</style>
</head>

<body>

<div class="container">

<label>caller name:</label>
<input id="callerName">

<label>called in regarding:</label>
<input id="reason">

<label>rx:</label>
<input id="rx">

<label>tasks:</label>
<div id="taskContainer"></div>

<div class="button-row">
<button onclick="generateNote()">submit</button>
<button onclick="resetForm()">cancel</button>
</div>

<div id="outputContainer"></div>

</div>

<script>

const TASKS=[
{
name:"manage claims",
taskText:"checked claims // located rx",
res:["claim reversed","claim paid","claim rejected","pharm unable to reverse",
"duplicate claim identified","r943 / refill too soon","r75 / prior authorization required",
"r76 / quantity limits reject","override applied per psa j/a","no avail override",
"escalated","no issue found"]
},
{
name:"view benefits",
taskText:"checked benefit coverage for mbr",
res:["coverage confirmed","non-covered","prior authorization required",
"tier level identified","utilization management applies"]
},
{
name:"cost estimator",
taskText:"checked cost and coverage for medication",
res:["estimated copay provided","prior authorization required",
"cost varies by pharmacy","advised NF"]
}
];

const container=document.getElementById("taskContainer");

TASKS.forEach((t,i)=>{
container.insertAdjacentHTML("beforeend",`
<div class="row">
<input type="checkbox" id="t${i}" onchange="toggleTask(${i})">
<label>${t.name}</label>
</div>

<div id="res${i}" class="resGroup">
${t.res.map((r,j)=>`
<div class="row">
<input type="checkbox" id="t${i}r${j}">
<span>${r}</span>
</div>`).join("")}
</div>

<input id="n${i}" class="subnote" placeholder="additional details">
`);
});

function toggleTask(i){
const checked=document.getElementById(`t${i}`).checked;
document.getElementById(`res${i}`).style.display=checked?'block':'none';
document.getElementById(`n${i}`).style.display=checked?'block':'none';
}

function generateNote(){

const outputContainer=document.getElementById("outputContainer");
outputContainer.innerHTML="";

TASKS.forEach((t,i)=>{
if(!document.getElementById(`t${i}`).checked) return;

let lines=[];

/* reason */
if(reason.value.trim()){
lines.push(`called in regarding ${reason.value.trim()} //`);
}

/* task */
lines.push(`${t.taskText} //`);

/* rx */
if(rx.value.trim()){
lines.push(`rx: ${rx.value.trim()} //`);
}

/* res */
t.res.forEach((r,j)=>{
if(document.getElementById(`t${i}r${j}`).checked){
lines.push(`${r} //`);
}
});

/* extra */
const extra=document.getElementById(`n${i}`).value.trim();
if(extra) lines.push(extra);

/* remove trailing // from final line */
if(lines.length){
let last = lines[lines.length-1];
lines[lines.length-1] = last.replace(/\s*\/\/$/, "");
}

const finalText = lines.join("\n");

/* create box */
outputContainer.insertAdjacentHTML("beforeend",`
<div class="outputBox">
<textarea readonly>${finalText}</textarea>
<div class="button-row">
<button onclick="copyThis(this)">copy</button>
<button onclick="finishNote()">finish</button>
</div>
</div>
`);
});

}

function copyThis(btn){
const text = btn.closest('.outputBox').querySelector('textarea');
text.select();
document.execCommand("copy");
}

function finishNote(){
resetForm();
document.getElementById("outputContainer").innerHTML="";
}

function resetForm(){
document.querySelectorAll("input,textarea").forEach(el=>{
if(el.type==="checkbox") el.checked=false;
else el.value="";
});
document.querySelectorAll(".resGroup,.subnote").forEach(el=>el.style.display="none");
}

</script>

</body>
</html>
