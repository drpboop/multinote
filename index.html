<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>note</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#000;
  color:#fff;
  font-family:"Century Gothic", sans-serif;
  margin:0;
  padding:20px;
}

.container{
  background:#111;
  padding:18px;
  border-radius:10px;
  max-width:600px;
  margin:auto;
}

label{
  display:block;
  margin:6px 0 3px;
}

input, textarea{
  width:100%;
  background:#222;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:6px;
  box-sizing:border-box;
}

textarea{
  min-height:50px;
  resize:none;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:20px 1fr;
  gap:8px;
  align-items:center;
  margin:2px 0;
}

.resGroup,
.subnote{
  display:none;
  padding-left:28px;
  margin-top:4px;
}

.outputBox{
  margin-top:12px;
  background:#111;
  padding:12px;
  border-radius:8px;
}

.outputTitle{
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
  color:#bbb;
}

.button-row{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

button{
  background:#444;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<label>caller name:</label>
<input id="callerName">

<label>called in regarding:</label>
<input id="reason">

<label>rx:</label>
<input id="rx">

<label>tasks:</label>
<div id="taskContainer"></div>

<div class="button-row">
<button onclick="generateNote()">submit</button>
<button onclick="clearOutputs()">cancel</button>
</div>

<div id="outputContainer"></div>

</div>

<script>

function autoExpand(el){
el.style.height="auto";
el.style.height=(el.scrollHeight)+"px";
}

const TASKS=[
{
name:"manage claims",
taskText:"checked claims",
res:[
"claim paid",
"claim rejected",
"claim reversed",
"duplicate claim identified",
"escalated",
"no avail override",
"override applied per psa j/a",
"pharm unable to reverse",
"r75 / prior authorization required",
"r76 / quantity limits",
"r88 / dur",
"r943 / refill too soon",
"reviewed pricing details"
]
},
{
name:"view benefits",
taskText:"checked benefit coverage",
res:[
"reviewed benefit details",
"category coverage confirmed",
"reviewed copay structure",
"cost share provided per tier",
"coverage confirmed",
"plan limitation applies",
"utilization management applies"
]
},
{
name:"cost estimator",
taskText:"checked cost and coverage for medication",
res:[
"advised non formulary",
"advised of prior authorization / quantity limits required",
"advised of tier / coverage",
"cost varies by pharmacy",
"estimated copay provided",
"provided alt medications",
"tier level identified"
]
},
{
name:"request summary",
taskText:"check prior authorization status for rx",
res:[
"advised of appeal / next steps per denial letter",
"advised of approval",
"advised of denial",
"advised to schedule p2p",
"clinical review in progress",
"provider outreach needed / additional info being requested"
]
},
{
name:"sending forms",
taskText:"reviewed forms",
res:[
"follow up recommended",
"forms emailed",
"forms faxed",
"prior authorization approval resent to provider",
"prior authorization denial resent to provider",
"turnaround time provided per j/a"
]
},
{
name:"prime resolution",
taskText:"reviewed cases",
res:[
"case already open",
"case closed",
"case created",
"case escalated",
"case updated",
"no case needed"
]
},
{
name:"locate pharm",
taskText:"check in network pharms",
res:[
"located and provided pharm details",
"mail order option provided",
"pharmacy not found",
"provider to resend rx"
]
},
{
name:"accumulators",
taskText:"reviewed current accumulator totals",
res:[
"accumulators incorrect",
"accumulators reset upcoming",
"accumulators still accruing",
"advised of accumulator balances",
"ded met",
"ded remaining",
"financial responsibility explained",
"oop max met",
"oop max remaining",
"recent claims not yet applied"
]
}
];

const container=document.getElementById("taskContainer");

TASKS.forEach((t,i)=>{
container.insertAdjacentHTML("beforeend",`
<div class="row">
<input type="checkbox" id="t${i}" onchange="toggleTask(${i})">
<label>${t.name}</label>
</div>

<div id="res${i}" class="resGroup">
${t.res.map((r,j)=>`
<div class="row">
<input type="checkbox" id="t${i}r${j}">
<span>${r}</span>
</div>`).join("")}
</div>

<textarea id="n${i}" class="subnote" placeholder="additional details" oninput="autoExpand(this)"></textarea>
`);
});

function toggleTask(i){
const checked=document.getElementById(`t${i}`).checked;
document.getElementById(`res${i}`).style.display=checked?'block':'none';
document.getElementById(`n${i}`).style.display=checked?'block':'none';
if(!checked){
document.getElementById(`n${i}`).value='';
document.getElementById(`n${i}`).style.height="auto";
}
}

function generateNote(){

const output=document.getElementById("outputContainer");
output.innerHTML="";

TASKS.forEach((t,i)=>{
if(!document.getElementById(`t${i}`).checked) return;

let lines=[];

if(reason.value.trim()){
lines.push(`called in regarding ${reason.value.trim()} //`);
}

lines.push(`${t.taskText} //`);

if(rx.value.trim()){
lines.push(`rx: ${rx.value.trim()} //`);
}

t.res.forEach((r,j)=>{
if(document.getElementById(`t${i}r${j}`).checked){
lines.push(`${r} //`);
}
});

const extra=document.getElementById(`n${i}`).value.trim();
if(extra) lines.push(extra);

if(lines.length){
lines[lines.length-1]=lines[lines.length-1].replace(/\s*\/\/$/,"");
}

const finalText=lines.join("\n");

output.insertAdjacentHTML("beforeend",`
<div class="outputBox">
<div class="outputTitle">${t.name.toUpperCase()}</div>
<textarea readonly oninput="autoExpand(this)">${finalText}</textarea>
<div class="button-row">
<button onclick="copyThis(this)">copy</button>
<button onclick="finishNote()">finish</button>
</div>
</div>
`);
});

}

function copyThis(btn){
const t=btn.closest('.outputBox').querySelector('textarea');
t.select();
document.execCommand("copy");
}

/* ✅ NEW cancel behavior */
function clearOutputs(){
document.getElementById("outputContainer").innerHTML="";
}

function finishNote(){
resetForm();
document.getElementById("outputContainer").innerHTML="";
}

function resetForm(){
document.querySelectorAll("input,textarea").forEach(el=>{
if(el.type==="checkbox") el.checked=false;
else{
el.value="";
el.style.height="auto";
}
});
document.querySelectorAll(".resGroup,.subnote").forEach(el=>el.style.display="none");
}

</script>

</body>
</html>
